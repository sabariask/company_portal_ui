<div class="page-header">
  <h2>Projects</h2>
  <button mat-raised-button color="primary" *ngIf="isAdminOrManager" (click)="openCreateProject()">
    Create Project
  </button>
</div>

<table mat-table [dataSource]="projects">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Project Id</th>
    <td mat-cell *matCellDef="let project">{{ project.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Project Name</th>
    <td mat-cell *matCellDef="let project">{{ project.name }}</td>
  </ng-container>

  <ng-container matColumnDef="department">
    <th mat-header-cell *matHeaderCellDef>Department</th>
    <td mat-cell *matCellDef="let project">{{ project.department?.name }}</td>
  </ng-container>

  <ng-container matColumnDef="edit">
    <th mat-header-cell *matHeaderCellDef>Edit Project</th>
    <td mat-cell *matCellDef="let project">
      <button mat-raised-button color="primary" (click)="editProject(project)">Edit</button>
    </td>
  </ng-container>

  <ng-container matColumnDef="delete">
    <th mat-header-cell *matHeaderCellDef>Delete Project</th>
    <td mat-cell *matCellDef="let project">
      <button mat-raised-button color="primary" (click)="deleteProject(project.id)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
