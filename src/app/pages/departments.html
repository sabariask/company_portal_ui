<h2>Departments</h2>

<div *ngIf="isAdmin">
  <form (ngSubmit)="create($event)" #f="ngForm" autocomplete="off">
    <mat-form-field appearance="outline">
      <mat-label>Department Name</mat-label>
      <input matInput [(ngModel)]="names" name="DepartmentName" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <input matInput type="text" [(ngModel)]="description" name="description" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Create</button>
  </form>
</div>
<br />
<hr />

<table mat-table [dataSource]="departments">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>Department Id</th>
    <td mat-cell *matCellDef="let department">{{ department.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let department">{{ department.name }}</td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let department">{{ department.description }}</td>
  </ng-container>

  <ng-container matColumnDef="actions" *ngIf="isAdmin">
    <th mat-header-cell *matHeaderCellDef>Actions</th>

    <td mat-cell *matCellDef="let department">
      <button mat-raised-button color="warn" (click)="delete(department.id)">Delete</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<hr />
